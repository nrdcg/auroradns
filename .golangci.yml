version: "2"

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true

linters:
  default: all
  disable:
    - canonicalheader
    - cyclop
    - dupl
    - err113
    - errname # breaking
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - forcetypeassert
    - lll
    - mnd
    - gomodguard
    - nlreturn
    - noctx
    - paralleltest
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl # Deprecated

  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/instana/testify
              desc: not allowed
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package
    funlen:
      lines: -1
      statements: 40
    goconst:
      min-len: 5
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - sloppyReassign
        - rangeValCopy
        - octalLiteral
        - paramTypeCombine
      enabled-tags:
        - diagnostic
        - style
        - performance
      settings:
        hugeParam:
          sizeThreshold: 100
    gocyclo:
      min-complexity: 15
    godox:
      keywords:
        - FIXME
    gosec:
      excludes:
        - G704
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    perfsprint:
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: false

  exclusions:
    warn-unused: true
    presets:
      - comments
    rules:
      - linters:
          - bodyclose
          - funlen
          - goconst
        path: .*_test.go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
